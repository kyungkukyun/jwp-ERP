<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 근태관리 (HTML/CSS/JS)</title>
  
  <!-- CSS 영역: Tailwind CSS 및 사용자 지정 스타일 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', sans-serif;
    }
    
    /* 스크롤바 숨기기 (기능은 유지) */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 탭 페이드 인 애니메이션 */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 슬라이드 인 애니메이션 */
    .slide-in {
      animation: slideIn 0.3s ease-out forwards;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>

<!-- HTML 영역 -->
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-purple-50 p-3 md:p-8 text-slate-800 selection:bg-indigo-200 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6 md:space-y-8">
    
    <!-- 헤더 섹션 -->
    <header class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-5 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 overflow-hidden relative">
      <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
      
      <div class="flex items-center gap-4 min-w-0 w-full md:w-auto mt-2 md:mt-0">
        <div class="p-3 md:p-4 bg-gradient-to-br from-indigo-100 to-purple-100 text-indigo-600 rounded-2xl shrink-0 shadow-inner">
          <i data-lucide="sparkles" class="w-6 h-6 md:w-8 md:h-8"></i>
        </div>
        <div class="min-w-0 flex-1">
          <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 tracking-tight truncate">
            스마트 근태관리
          </h1>
          <p class="text-slate-500 text-sm md:text-base font-medium mt-1 truncate">오늘 하루도 힘차게 시작하세요!</p>
        </div>
      </div>
      
      <div class="text-center md:text-right shrink-0 bg-slate-50/50 p-4 md:p-5 rounded-2xl border border-slate-100">
        <p id="current-date" class="text-sm md:text-base font-semibold text-slate-500 whitespace-nowrap mb-1"></p>
        <p id="current-time" class="text-3xl md:text-5xl font-black text-indigo-600 tracking-tighter whitespace-nowrap drop-shadow-sm">
          00:00:00
        </p>
      </div>
    </header>

    <!-- 탭 네비게이션 -->
    <div class="flex justify-center md:justify-start">
      <div class="flex gap-2 p-1.5 bg-white/60 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/60 overflow-x-auto scrollbar-hide">
        <button onclick="app.switchTab('kiosk')" id="tab-btn-kiosk" class="flex items-center gap-2 px-5 md:px-7 py-2.5 md:py-3.5 rounded-xl font-bold transition-all duration-300 whitespace-nowrap shrink-0 bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 scale-100">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-sm md:text-base">출퇴근 등록</span>
        </button>
        <button onclick="app.switchTab('history')" id="tab-btn-history" class="flex items-center gap-2 px-5 md:px-7 py-2.5 md:py-3.5 rounded-xl font-bold transition-all duration-300 whitespace-nowrap shrink-0 bg-transparent text-slate-500 hover:text-indigo-600 hover:bg-white scale-95 hover:scale-100">
          <i data-lucide="history" class="w-5 h-5"></i>
          <span class="text-sm md:text-base">전체 기록 조회</span>
        </button>
        <button onclick="app.switchTab('management')" id="tab-btn-management" class="flex items-center gap-2 px-5 md:px-7 py-2.5 md:py-3.5 rounded-xl font-bold transition-all duration-300 whitespace-nowrap shrink-0 bg-transparent text-slate-500 hover:text-indigo-600 hover:bg-white scale-95 hover:scale-100">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span class="text-sm md:text-base">직원 관리</span>
        </button>
      </div>
    </div>

    <!-- 1. 출퇴근 등록 (키오스크) 뷰 -->
    <div id="view-kiosk" class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 fade-in">
      
      <!-- 좌측 패널 -->
      <div class="lg:col-span-5 flex flex-col gap-6 md:gap-8">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 md:p-8">
          <h2 class="text-lg md:text-xl font-bold mb-6 flex items-center gap-3 text-slate-800">
            <div class="p-2 bg-indigo-100 rounded-lg text-indigo-600 shrink-0">
              <i data-lucide="user-check" class="w-5 h-5"></i>
            </div>
            <span>직원 선택 및 등록</span>
          </h2>

          <!-- 메시지 영역 -->
          <div id="msg-kiosk" class="h-auto min-h-[3.5rem] mb-6 hidden"></div>

          <!-- 직원 선택 -->
          <div class="mb-8 md:mb-10">
            <label class="block text-sm md:text-base font-bold text-slate-600 mb-3 ml-1">본인의 이름을 선택해주세요</label>
            <div class="relative group">
              <select id="kiosk-emp-select" class="w-full bg-slate-50/50 hover:bg-slate-50 border-2 border-slate-100 text-slate-800 text-base md:text-lg rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 block p-4 md:p-5 outline-none transition-all cursor-pointer appearance-none font-semibold">
                <!-- JS 렌더링 -->
              </select>
              <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400 group-hover:text-indigo-500 transition-colors">
                <i data-lucide="chevron-down" class="w-5 h-5"></i>
              </div>
            </div>
          </div>

          <!-- 버튼 -->
          <div class="grid grid-cols-2 gap-4 md:gap-5">
            <button onclick="app.handleClockIn()" class="group relative overflow-hidden rounded-2xl p-5 md:p-7 text-white shadow-lg shadow-emerald-500/30 transition-all duration-300 hover:shadow-emerald-500/40 hover:-translate-y-1 active:scale-95 bg-gradient-to-br from-emerald-500 to-teal-600">
              <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-500"></div>
              <div class="flex flex-col items-center gap-2 md:gap-3 relative z-10">
                <i data-lucide="log-in" class="w-8 h-8 md:w-10 md:h-10 text-emerald-100 group-hover:text-white transition-colors"></i>
                <span class="text-lg md:text-xl font-extrabold whitespace-nowrap tracking-wide">출근하기</span>
              </div>
            </button>
            <button onclick="app.handleClockOut()" class="group relative overflow-hidden rounded-2xl p-5 md:p-7 text-white shadow-lg shadow-rose-500/30 transition-all duration-300 hover:shadow-rose-500/40 hover:-translate-y-1 active:scale-95 bg-gradient-to-br from-rose-500 to-pink-600">
              <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-500"></div>
              <div class="flex flex-col items-center gap-2 md:gap-3 relative z-10">
                <i data-lucide="log-out" class="w-8 h-8 md:w-10 md:h-10 text-rose-100 group-hover:text-white transition-colors"></i>
                <span class="text-lg md:text-xl font-extrabold whitespace-nowrap tracking-wide">퇴근하기</span>
              </div>
            </button>
          </div>
        </div>

        <!-- 현황 요약 -->
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 md:p-8">
          <h3 class="text-base md:text-lg font-bold mb-5 text-slate-800 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
            실시간 근무 현황
          </h3>
          <div class="flex justify-around text-center gap-4">
            <div class="p-4 md:p-6 bg-gradient-to-br from-indigo-50 to-blue-50 rounded-2xl flex-1 border border-indigo-100/50 shadow-inner">
              <p class="text-xs md:text-sm text-indigo-600 font-bold mb-2">근무중</p>
              <p class="text-2xl md:text-4xl font-black text-indigo-700">
                <span id="stat-in-count">0</span><span class="text-base md:text-xl font-medium text-indigo-400 ml-1">명</span>
              </p>
            </div>
            <div class="p-4 md:p-6 bg-slate-50/80 rounded-2xl flex-1 border border-slate-100 shadow-inner">
              <p class="text-xs md:text-sm text-slate-500 font-bold mb-2">미출근/퇴근</p>
              <p class="text-2xl md:text-4xl font-black text-slate-700">
                <span id="stat-out-count">0</span><span class="text-base md:text-xl font-medium text-slate-400 ml-1">명</span>
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- 우측 타임라인 -->
      <div class="lg:col-span-7 flex flex-col gap-6 md:gap-8">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white flex-1 flex flex-col min-h-[500px] overflow-hidden">
          <div class="p-6 md:p-8 border-b border-slate-100/80 bg-white/50">
            <h2 class="text-lg md:text-xl font-bold flex items-center gap-3 text-slate-800">
              <div class="p-2 bg-purple-100 rounded-lg text-purple-600 shrink-0">
                <i data-lucide="clipboard-list" class="w-5 h-5"></i>
              </div>
              오늘의 출퇴근 타임라인
            </h2>
          </div>
          <div id="kiosk-logs-list" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50/30">
            <!-- JS 렌더링 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 전체 기록 조회 뷰 -->
    <div id="view-history" class="hidden bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 md:p-8 fade-in">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 mb-8">
        <h2 class="text-xl md:text-2xl font-bold flex items-center gap-3 text-slate-800">
          <div class="p-2 bg-blue-100 rounded-lg text-blue-600 shrink-0">
            <i data-lucide="history" class="w-6 h-6"></i>
          </div>
          상세 출퇴근 기록
        </h2>
        <div class="flex items-center gap-3 w-full md:w-auto">
          <div class="relative w-full md:w-72 shrink-0 group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
            </div>
            <input type="text" id="history-search" oninput="app.updateSearch(this.value)" placeholder="이름 또는 부서 검색..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm md:text-base font-medium focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" />
          </div>
          <button onclick="app.exportToExcel()" class="flex items-center justify-center gap-2 px-4 py-3 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 rounded-2xl font-bold transition-all active:scale-95 whitespace-nowrap shrink-0 shadow-sm">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span class="hidden md:inline">엑셀 저장</span>
          </button>
        </div>
      </div>

      <div class="overflow-x-auto rounded-2xl border border-slate-100 shadow-sm">
        <table class="w-full text-left border-collapse min-w-[600px] bg-white">
          <thead>
            <tr class="bg-slate-50/80 border-b border-slate-100 text-slate-500 font-bold text-sm uppercase tracking-wider whitespace-nowrap">
              <th class="p-4 md:p-5">날짜</th>
              <th class="p-4 md:p-5">부서</th>
              <th class="p-4 md:p-5">이름</th>
              <th class="p-4 md:p-5">출근 시간</th>
              <th class="p-4 md:p-5">퇴근 시간</th>
            </tr>
          </thead>
          <tbody id="history-table-body" class="divide-y divide-slate-50">
            <!-- JS 렌더링 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. 직원 관리 뷰 -->
    <div id="view-management" class="hidden bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 md:p-8 fade-in">
      <h2 class="text-xl md:text-2xl font-bold flex items-center gap-3 text-slate-800 mb-6 md:mb-8">
        <div class="p-2 bg-teal-100 rounded-lg text-teal-600 shrink-0">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
        직원 명단 관리
      </h2>

      <!-- 메시지 영역 -->
      <div id="msg-management" class="h-auto min-h-[3.5rem] mb-6 hidden"></div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
        <!-- 직원 추가 폼 -->
        <div class="lg:col-span-1 bg-gradient-to-b from-slate-50 to-white p-6 md:p-8 rounded-3xl border border-slate-100 shadow-sm h-fit">
          <h3 class="text-base md:text-lg font-bold mb-6 flex items-center gap-2 text-slate-800">
            <i data-lucide="user-plus" class="w-5 h-5 text-indigo-500"></i>
            신규 직원 등록
          </h3>
          <form onsubmit="app.addEmployee(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-bold text-slate-600 mb-2">부서명</label>
              <input type="text" id="new-emp-dept" placeholder="예: 기획팀" class="w-full px-4 py-3 border-2 border-slate-100 bg-white rounded-xl text-sm md:text-base font-medium focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" />
            </div>
            <div>
              <label class="block text-sm font-bold text-slate-600 mb-2">이름</label>
              <input type="text" id="new-emp-name" placeholder="예: 홍길동" class="w-full px-4 py-3 border-2 border-slate-100 bg-white rounded-xl text-sm md:text-base font-medium focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" />
            </div>
            <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl text-sm md:text-base hover:bg-slate-900 transition-all active:scale-95 shadow-md shadow-slate-800/20 mt-2">
              직원 등록하기
            </button>
          </form>
        </div>

        <!-- 직원 목록 -->
        <div class="lg:col-span-2">
          <div class="overflow-x-auto rounded-2xl border border-slate-100 shadow-sm">
            <table class="w-full text-left border-collapse min-w-[600px] bg-white">
              <thead>
                <tr class="bg-slate-50/80 border-b border-slate-100 text-slate-500 font-bold text-sm uppercase tracking-wider whitespace-nowrap">
                  <th class="p-4 md:p-5">사번</th>
                  <th class="p-4 md:p-5">부서</th>
                  <th class="p-4 md:p-5">이름</th>
                  <th class="p-4 md:p-5">상태</th>
                  <th class="p-4 md:p-5 text-center">관리</th>
                </tr>
              </thead>
              <tbody id="management-table-body" class="divide-y divide-slate-50">
                <!-- JS 렌더링 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript 영역 -->
  <script>
    const app = (() => {
      // 상태 데이터
      let state = {
        employees: [
          { id: 'EMP001', name: '김철수', department: '개발팀', status: 'OUT' },
          { id: 'EMP002', name: '이영희', department: '디자인팀', status: 'OUT' },
          { id: 'EMP003', name: '박민수', department: '영업팀', status: 'OUT' },
          { id: 'EMP004', name: '정지원', department: '마케팅팀', status: 'OUT' },
          { id: 'EMP005', name: '최동훈', department: '인사팀', status: 'OUT' }
        ],
        logs: [],
        currentHistoryRecords: [], // 추가: 엑셀 다운로드를 위해 현재 표시 중인 기록 보관
        activeTab: 'kiosk',
        searchTerm: '',
        editingId: null,
        messageTimeout: null
      };

      // 시계 업데이트
      function updateClock() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const week = ['일', '월', '화', '수', '목', '금', '토'];
        const dayOfWeek = week[now.getDay()];
        
        document.getElementById('current-date').innerText = `${year}.${month}.${day} (${dayOfWeek})`;
        document.getElementById('current-time').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
      }

      // 메시지 토스트
      function showMessage(text, type = 'success') {
        const msgHtml = `
          <div class="flex items-center gap-3 p-4 rounded-2xl text-sm md:text-base font-bold transition-all break-keep border slide-in ${
            type === 'error' ? 'bg-red-50 text-red-600 border-red-100 shadow-sm shadow-red-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100 shadow-sm shadow-emerald-100'
          }">
            <i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-5 h-5 shrink-0"></i>
            <span class="flex-1">${text}</span>
          </div>
        `;
        
        const elKiosk = document.getElementById('msg-kiosk');
        const elMgmt = document.getElementById('msg-management');
        
        elKiosk.innerHTML = msgHtml;
        elMgmt.innerHTML = msgHtml;
        elKiosk.classList.remove('hidden');
        elMgmt.classList.remove('hidden');
        lucide.createIcons();

        if (state.messageTimeout) clearTimeout(state.messageTimeout);
        state.messageTimeout = setTimeout(() => {
          elKiosk.classList.add('hidden');
          elMgmt.classList.add('hidden');
        }, 3000);
      }

      // 탭 전환 로직
      function switchTab(tabId) {
        state.activeTab = tabId;
        
        ['kiosk', 'history', 'management'].forEach(t => {
          document.getElementById(`view-${t}`).classList.add('hidden');
          const btn = document.getElementById(`tab-btn-${t}`);
          btn.className = "flex items-center gap-2 px-5 md:px-7 py-2.5 md:py-3.5 rounded-xl font-bold transition-all duration-300 whitespace-nowrap shrink-0 bg-transparent text-slate-500 hover:text-indigo-600 hover:bg-white scale-95 hover:scale-100";
        });

        document.getElementById(`view-${tabId}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`tab-btn-${tabId}`);
        activeBtn.className = "flex items-center gap-2 px-5 md:px-7 py-2.5 md:py-3.5 rounded-xl font-bold transition-all duration-300 whitespace-nowrap shrink-0 bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 scale-100";
        
        if(tabId === 'history') renderHistory();
        if(tabId === 'management') renderManagement();
      }

      // 출근
      function handleClockIn() {
        const selectEl = document.getElementById('kiosk-emp-select');
        const empId = selectEl.value;
        if (!empId) return showMessage('직원을 먼저 선택해주세요.', 'error');

        const empIndex = state.employees.findIndex(e => e.id === empId);
        if (state.employees[empIndex].status === 'IN') return showMessage('이미 출근 상태입니다.', 'error');

        state.employees[empIndex].status = 'IN';
        const now = new Date();
        state.logs.unshift({
          id: Date.now().toString(),
          employeeName: state.employees[empIndex].name,
          department: state.employees[empIndex].department,
          type: 'IN',
          timestamp: now,
          timeString: now.toLocaleTimeString('ko-KR', { hour12: false })
        });
        
        showMessage(`${state.employees[empIndex].name}님, 출근 처리되었습니다.`);
        selectEl.value = "";
        renderKioskData();
      }

      // 퇴근
      function handleClockOut() {
        const selectEl = document.getElementById('kiosk-emp-select');
        const empId = selectEl.value;
        if (!empId) return showMessage('직원을 먼저 선택해주세요.', 'error');

        const empIndex = state.employees.findIndex(e => e.id === empId);
        if (state.employees[empIndex].status === 'OUT') return showMessage('현재 출근 상태가 아닙니다.', 'error');

        state.employees[empIndex].status = 'OUT';
        const now = new Date();
        state.logs.unshift({
          id: Date.now().toString(),
          employeeName: state.employees[empIndex].name,
          department: state.employees[empIndex].department,
          type: 'OUT',
          timestamp: now,
          timeString: now.toLocaleTimeString('ko-KR', { hour12: false })
        });
        
        showMessage(`${state.employees[empIndex].name}님, 퇴근 처리되었습니다.`);
        selectEl.value = "";
        renderKioskData();
      }

      // 직원 추가
      function addEmployee(e) {
        e.preventDefault();
        const deptEl = document.getElementById('new-emp-dept');
        const nameEl = document.getElementById('new-emp-name');
        
        if(!deptEl.value.trim() || !nameEl.value.trim()) return showMessage('이름과 부서를 모두 입력해주세요.', 'error');

        const lastIdNum = state.employees.length > 0 ? Math.max(...state.employees.map(emp => parseInt(emp.id.replace('EMP', '')))) : 0;
        const newId = `EMP${String(lastIdNum + 1).padStart(3, '0')}`;
        
        state.employees.push({
          id: newId, name: nameEl.value.trim(), department: deptEl.value.trim(), status: 'OUT'
        });

        showMessage(`${nameEl.value.trim()} 직원이 추가되었습니다.`);
        deptEl.value = ''; nameEl.value = '';
        renderManagement();
        renderKioskData();
      }

      // 직원 삭제
      function deleteEmployee(id, name) {
        state.employees = state.employees.filter(e => e.id !== id);
        showMessage(`${name} 직원이 명단에서 삭제되었습니다.`);
        renderManagement();
        renderKioskData();
      }

      // 수정 시작
      function startEdit(id) {
        state.editingId = id;
        renderManagement();
      }

      // 수정 취소
      function cancelEdit() {
        state.editingId = null;
        renderManagement();
      }

      // 수정 저장
      function saveEdit(id) {
        const dept = document.getElementById(`edit-dept-${id}`).value;
        const name = document.getElementById(`edit-name-${id}`).value;
        
        if(!dept.trim() || !name.trim()) return showMessage('이름과 부서를 입력해주세요.', 'error');
        
        const emp = state.employees.find(e => e.id === id);
        emp.department = dept.trim();
        emp.name = name.trim();
        
        state.editingId = null;
        showMessage(`직원 정보가 수정되었습니다.`);
        renderManagement();
        renderKioskData();
      }

      // 검색 업데이트
      function updateSearch(val) {
        state.searchTerm = val;
        renderHistory();
      }

      // --- 렌더링 헬퍼 ---

      function renderKioskData() {
        // 셀렉트 박스 렌더링
        const select = document.getElementById('kiosk-emp-select');
        let options = `<option value="" disabled selected>-- 직원을 선택하세요 --</option>`;
        state.employees.forEach(emp => {
          options += `<option value="${emp.id}">${emp.department} - ${emp.name} ${emp.status === 'IN' ? '(현재 근무중)' : ''}</option>`;
        });
        select.innerHTML = options;

        // 현황 통계
        const inCount = state.employees.filter(e => e.status === 'IN').length;
        const outCount = state.employees.filter(e => e.status === 'OUT').length;
        document.getElementById('stat-in-count').innerText = inCount;
        document.getElementById('stat-out-count').innerText = outCount;

        // 타임라인 로그
        const logsContainer = document.getElementById('kiosk-logs-list');
        if (state.logs.length === 0) {
          logsContainer.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-4 py-16">
              <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-2 shadow-inner">
                <i data-lucide="clipboard-list" class="w-10 h-10 opacity-40"></i>
              </div>
              <p class="text-sm md:text-base font-medium">오늘 등록된 출퇴근 기록이 없습니다.</p>
              <p class="text-xs text-slate-300">첫 번째로 출근 도장을 찍어보세요!</p>
            </div>
          `;
        } else {
          logsContainer.innerHTML = `<ul class="space-y-3 md:space-y-4">` + state.logs.map((log, index) => `
            <li class="group flex items-center justify-between p-4 md:p-5 bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:border-indigo-100 transition-all duration-300 gap-3 slide-in" style="animation-delay: ${index * 50}ms">
              <div class="flex items-center gap-4 md:gap-5 min-w-0 flex-1">
                <div class="p-3 rounded-2xl shrink-0 transition-colors ${log.type === 'IN' ? 'bg-emerald-50 text-emerald-600 group-hover:bg-emerald-100' : 'bg-rose-50 text-rose-600 group-hover:bg-rose-100'}">
                  <i data-lucide="${log.type === 'IN' ? 'log-in' : 'log-out'}" class="w-6 h-6"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <p class="font-extrabold text-slate-800 text-base md:text-lg truncate flex items-center gap-2">
                    ${log.employeeName} 
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 text-slate-500 truncate max-w-[100px]">${log.department}</span>
                  </p>
                  <p class="text-sm font-bold mt-0.5 truncate ${log.type === 'IN' ? 'text-emerald-600' : 'text-rose-500'}">
                    ${log.type === 'IN' ? '출근 완료' : '퇴근 완료'}
                  </p>
                </div>
              </div>
              <div class="text-right shrink-0 ml-2 flex flex-col items-end">
                <span class="inline-block px-3 py-1.5 bg-slate-50 text-slate-700 rounded-xl font-mono text-sm md:text-lg font-bold border border-slate-100 group-hover:bg-indigo-50 group-hover:text-indigo-700 transition-colors">
                  ${log.timeString}
                </span>
              </div>
            </li>
          `).join('') + `</ul>`;
        }
        lucide.createIcons();
      }

      function renderHistory() {
        const tbody = document.getElementById('history-table-body');
        
        // 1. 로그 데이터를 직원별, 날짜별 1줄로 병합
        const recordsMap = new Map();
        
        // 오래된 기록(배열의 끝)부터 처리하여 첫 출근 시간과 마지막 퇴근 시간을 구함
        [...state.logs].reverse().forEach(log => {
          const dateStr = log.timestamp.toLocaleDateString('ko-KR');
          const key = `${dateStr}-${log.employeeName}`;
          
          if (!recordsMap.has(key)) {
            recordsMap.set(key, {
              date: dateStr,
              timestamp: log.timestamp, // 정렬용
              department: log.department,
              employeeName: log.employeeName,
              inTime: '-',
              outTime: '-'
            });
          }
          
          const record = recordsMap.get(key);
          if (log.type === 'IN') {
            if (record.inTime === '-') record.inTime = log.timeString; // 첫 출근
          } else if (log.type === 'OUT') {
            record.outTime = log.timeString; // 마지막 퇴근으로 계속 덮어씀
          }
        });

        // 최신 날짜순 정렬
        let dailyRecords = Array.from(recordsMap.values()).sort((a, b) => b.timestamp - a.timestamp);
        
        // 검색어 필터링 적용
        const filtered = dailyRecords.filter(record => 
          record.employeeName.includes(state.searchTerm) || record.department.includes(state.searchTerm)
        );

        // 엑셀 다운로드를 위해 전역 상태에 저장
        state.currentHistoryRecords = filtered;
        
        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colSpan="5" class="p-10 text-center text-slate-400 font-medium">검색 결과나 기록이 존재하지 않습니다.</td></tr>`;
        } else {
          tbody.innerHTML = filtered.map(record => `
            <tr class="hover:bg-indigo-50/30 transition-colors text-sm md:text-base whitespace-nowrap group">
              <td class="p-4 md:p-5 text-slate-600 font-medium">${record.date}</td>
              <td class="p-4 md:p-5 text-slate-600">${record.department}</td>
              <td class="p-4 md:p-5 font-bold text-slate-900">${record.employeeName}</td>
              <td class="p-4 md:p-5">
                <span class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-bold border ${record.inTime !== '-' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-slate-50 text-slate-400 border-slate-100'}">
                  ${record.inTime}
                </span>
              </td>
              <td class="p-4 md:p-5">
                <span class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-bold border ${record.outTime !== '-' ? 'bg-rose-50 text-rose-700 border-rose-100' : 'bg-slate-50 text-slate-400 border-slate-100'}">
                  ${record.outTime}
                </span>
              </td>
            </tr>
          `).join('');
        }
      }

      function exportToExcel() {
        if (state.currentHistoryRecords.length === 0) {
          showMessage('다운로드할 기록이 없습니다.', 'error');
          return;
        }

        // 엑셀(CSV) 한글 깨짐 방지를 위한 BOM 문자 추가
        let csvContent = "\uFEFF"; 
        csvContent += "날짜,부서,이름,출근 시간,퇴근 시간\n";
        
        state.currentHistoryRecords.forEach(row => {
          csvContent += `${row.date},${row.department},${row.employeeName},${row.inTime},${row.outTime}\n`;
        });

        // Blob을 이용해 가상의 파일 링크 생성 후 다운로드 트리거
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        const today = new Date();
        const dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${today.getDate().toString().padStart(2,'0')}`;
        
        link.setAttribute("href", url);
        link.setAttribute("download", `출퇴근기록_${dateStr}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      function renderManagement() {
        const tbody = document.getElementById('management-table-body');
        if (state.employees.length === 0) {
          tbody.innerHTML = `<tr><td colSpan="5" class="p-10 text-center text-slate-400 font-medium">등록된 직원이 없습니다.</td></tr>`;
        } else {
          tbody.innerHTML = state.employees.map(emp => {
            if (state.editingId === emp.id) {
              return `
                <tr class="hover:bg-slate-50/50 transition-colors text-sm md:text-base whitespace-nowrap">
                  <td class="p-4 md:p-5 font-mono text-slate-500 font-medium">${emp.id}</td>
                  <td class="p-3 md:p-4"><input type="text" id="edit-dept-${emp.id}" value="${emp.department}" class="w-full min-w-[100px] px-3 py-2 border-2 border-indigo-200 rounded-lg focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none text-sm font-medium"></td>
                  <td class="p-3 md:p-4"><input type="text" id="edit-name-${emp.id}" value="${emp.name}" class="w-full min-w-[90px] px-3 py-2 border-2 border-indigo-200 rounded-lg focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none text-sm font-medium"></td>
                  <td class="p-4 md:p-5"><span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border ${emp.status === 'IN' ? 'bg-indigo-50 text-indigo-700 border-indigo-100' : 'bg-slate-50 text-slate-600 border-slate-200'}">${emp.status === 'IN' ? '근무중' : '미출근'}</span></td>
                  <td class="p-4 md:p-5 text-center">
                    <div class="flex justify-center gap-2">
                      <button onclick="app.saveEdit('${emp.id}')" class="p-2 text-emerald-600 bg-emerald-50 hover:bg-emerald-100 rounded-xl transition-colors shadow-sm" title="저장"><i data-lucide="save" class="w-4 h-4"></i></button>
                      <button onclick="app.cancelEdit()" class="p-2 text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors shadow-sm" title="취소"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                  </td>
                </tr>
              `;
            } else {
              return `
                <tr class="hover:bg-slate-50/50 transition-colors text-sm md:text-base whitespace-nowrap group">
                  <td class="p-4 md:p-5 font-mono text-slate-500 font-medium">${emp.id}</td>
                  <td class="p-4 md:p-5 text-slate-600 font-medium truncate max-w-[140px]">${emp.department}</td>
                  <td class="p-4 md:p-5 font-bold text-slate-900 truncate max-w-[120px]">${emp.name}</td>
                  <td class="p-4 md:p-5"><span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border ${emp.status === 'IN' ? 'bg-indigo-50 text-indigo-700 border-indigo-100' : 'bg-slate-50 text-slate-600 border-slate-200'}">${emp.status === 'IN' ? '근무중' : '미출근'}</span></td>
                  <td class="p-4 md:p-5 text-center">
                    <div class="flex justify-center gap-2 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity duration-200">
                      <button onclick="app.startEdit('${emp.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition-colors" title="수정"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                      <button onclick="app.deleteEmployee('${emp.id}', '${emp.name}')" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl transition-colors" title="삭제"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                  </td>
                </tr>
              `;
            }
          }).join('');
        }
        lucide.createIcons();
      }

      // 초기화
      function init() {
        setInterval(updateClock, 1000);
        updateClock();
        renderKioskData();
        renderHistory();
        renderManagement();
        lucide.createIcons();
      }

      // 외부 접근 가능 API 매핑
      return { init, switchTab, handleClockIn, handleClockOut, addEmployee, deleteEmployee, startEdit, cancelEdit, saveEdit, updateSearch, exportToExcel };
    })();

    // 앱 실행
    window.addEventListener('DOMContentLoaded', app.init);
  </script>
</body>
</html>
